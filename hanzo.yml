# Hanzo CI/CD for zooai/bridge-shim: .github/workflows/cicd.yml imports hanzoai/ci,
# which reads this file. The build door builds each image, one BuildKit Job
# per platform.
images:
  - name: bridge-shim
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/zooai/bridge-shim
    platforms: [linux/amd64]
