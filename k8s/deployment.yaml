apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoo-bridge
  namespace: zoo-bridge
  labels:
    app.kubernetes.io/name: zoo-bridge
    app.kubernetes.io/component: bridge
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: zoo-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zoo-bridge
        app.kubernetes.io/component: bridge
    spec:
      containers:
        - name: bridge
          image: ghcr.io/zooai/bridge-shim:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --tenant-config=/etc/bridge/tenant.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BRIDGE_TENANT_CONFIG
              value: /etc/bridge/tenant.yaml
          volumeMounts:
            - name: tenant-config
              mountPath: /etc/bridge
              readOnly: true
            - name: data
              mountPath: /var/lib/zoo-bridge
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: tenant-config
          configMap:
            name: zoo-bridge-tenant
        - name: data
          persistentVolumeClaim:
            claimName: zoo-bridge-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zoo-bridge-data
  namespace: zoo-bridge
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
